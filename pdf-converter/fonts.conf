<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
	fonts.conf : PDFに描くときの既定のフォント(コンテナの /etc/fonts/local.conf に置く)

	文書が指定するフォント(游ゴシック・メイリオ・ヒラギノ・Segoe UI など)は、再配布できないため
	このコンテナには無い。無いフォントは飛ばされ、最後の「総称」(sans-serif / system-ui /
	serif / monospace)に落ちる。その落ち先をここで決める。

	決めておかないと、落ち先が環境まかせになる。実際に、font-family の末尾が
	「system-ui, sans-serif」の文書で、本文がまるごと等幅フォントで描かれた。

	日本語は BIZ UDPゴシック / BIZ UDP明朝 を既定にする。理由:
	  - 字の幅が詰まっており(プロポーショナル)、游ゴシックやメイリオで見たときと行の折り返しが近い
	  - TrueType形式なので、PDFに文字として小さく埋め込める。Noto Sans CJK(CFF形式)は
	    1文字ずつ図形として埋め込まれ、PDFが2〜3倍の大きさになる
	  - Windows 10 以降に入っているフォントなので、受け取った人の画面とも見た目が揃いやすい
	Noto Sans CJK は、BIZ UD に無い字(中国語・韓国語・一部の漢字)のために残してある。
-->
<fontconfig>
	<alias binding="strong">
		<family>sans-serif</family>
		<prefer>
			<family>BIZ UDPGothic</family>
			<family>Noto Sans CJK JP</family>
		</prefer>
	</alias>
	<alias binding="strong">
		<family>serif</family>
		<prefer>
			<family>BIZ UDPMincho</family>
			<family>Noto Serif CJK JP</family>
		</prefer>
	</alias>
	<!-- コードは英数字の幅が揃うことが大事。英数字は Liberation Mono、日本語は等幅の BIZ UDゴシック -->
	<alias binding="strong">
		<family>monospace</family>
		<prefer>
			<family>Liberation Mono</family>
			<family>BIZ UDGothic</family>
		</prefer>
	</alias>
</fontconfig>
