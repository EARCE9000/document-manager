AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Document Manager on AWS (ECS Fargate + S3 + RDS for PostgreSQL).
  Creates the VPC, ALB with an ACM certificate, the ECS service, the RDS instance,
  the S3 bucket and the DNS record. See docs/website/aws-ecs-guide.md.

# 構成と各値の意味は docs/website/aws-ecs-guide.md を参照。
# - アプリは Docker Hub のイメージ(earce9000/document-manager)をそのまま使う
# - DB の接続情報は PGHOST/PGUSER/PGPASSWORD などの標準の環境変数で渡す(URL にパスワードを埋めない)
# - RDS は Aurora ではなく RDS for PostgreSQL。複数台構成で画面の自動更新に LISTEN/NOTIFY を使うため
# - スタックを削除しても、S3 バケットは残し、RDS はスナップショットを取ってから消す

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "公開する場所"}
        Parameters: [DomainName, HostedZoneId]
      - Label: {default: "ログイン(OpenID Connect)"}
        Parameters: [OidcIssuer, OidcClientId, OidcClientSecret, AdminEmail]
      - Label: {default: "規模(あとから変えられる)"}
        Parameters: [ImageTag, DesiredCount, TaskCpu, TaskMemory, DbInstanceClass, DbAllocatedStorage, DbMultiAz]
    ParameterLabels:
      DomainName: {default: "公開するホスト名"}
      HostedZoneId: {default: "そのホスト名を管理している Route 53 のホストゾーン"}
      OidcIssuer: {default: "OpenID Connect の issuer URL"}
      OidcClientId: {default: "クライアント ID"}
      OidcClientSecret: {default: "クライアントシークレット"}
      AdminEmail: {default: "最初の管理者のメールアドレス"}
      ImageTag: {default: "イメージのタグ"}
      DesiredCount: {default: "コンテナの台数"}
      TaskCpu: {default: "コンテナ 1 台の CPU"}
      TaskMemory: {default: "コンテナ 1 台のメモリ (MiB)"}
      DbInstanceClass: {default: "RDS のインスタンスクラス"}
      DbAllocatedStorage: {default: "RDS のストレージ (GiB)"}
      DbMultiAz: {default: "RDS をマルチ AZ にする"}

Parameters:
  DomainName:
    Type: String
    Description: 利用者が開くホスト名。HostedZoneId のゾーンの中の名前にする
    AllowedPattern: "^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
    ConstraintDescription: 小文字のホスト名(末尾のドットなし)
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 証明書の検証と DNS レコードの作成に使う
  OidcIssuer:
    Type: String
    Description: 例は Entra ID なら https://login.microsoftonline.com/<テナントID>/v2.0
    AllowedPattern: "^https://.+"
  OidcClientId:
    Type: String
    MinLength: 1
  OidcClientSecret:
    Type: String
    NoEcho: true
    MinLength: 1
  AdminEmail:
    Type: String
    Description: このアドレスでログインした人が最初の管理者になる(管理者が 1 人もいない間だけ)
    AllowedPattern: "^[^@\\s]+@[^@\\s]+$"
  ImageTag:
    Type: String
    Default: latest
    Description: earce9000/document-manager のタグ。版を固定したいときは日付のタグを指定する
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096"]
  TaskMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "3072", "4096", "8192"]
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  DbMultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Resources:
  # ---------------------------------------------------------------- ネットワーク
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public-1"}]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public-2"}]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-private-1"}]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-private-2"}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # 費用を抑えるため NAT ゲートウェイは 1 つ。止まるとログインとイメージの取得ができなくなる
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # 文書ファイルの読み書きを NAT に通さない(転送料がかからない)
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # ---------------------------------------------------------------- セキュリティグループ
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dm-alb - HTTPS from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dm-app - 8080 from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup}
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dm-db - 5432 from the app only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup}

  # ---------------------------------------------------------------- 文書ファイル(S3)
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  # ---------------------------------------------------------------- 秘密情報
  # DB のユーザー名とパスワード。RDS 任せの自動ローテーションは使わない
  # (動いているコンテナは起動時の値を持ち続けるため、ローテーションされると接続できなくなる)
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/db"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "dm_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/session"
      Description: SESSION_SECRET (ログインセッションの署名鍵)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  OidcSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/oidc-client-secret"
      SecretString: !Ref OidcClientSecret

  # ---------------------------------------------------------------- データベース(RDS for PostgreSQL)
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Document Manager private subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
  # EngineVersion はメジャー版だけを書く(RDS がその時点の既定のマイナー版を選ぶ)。
  # 17.4 のように固定すると、その版が廃止されたときにこのテンプレートで作れなくなる。
  # cfn-lint はマイナー版まで書いた値の一覧と照合するため、メジャー版だけだと W3691 を出す
  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3691]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "17"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref DbMultiAz
      DBName: document_manager
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

  # ---------------------------------------------------------------- 証明書・ロードバランサー・DNS
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /_ping
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref Certificate}]
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # ---------------------------------------------------------------- アプリ(ECS on Fargate)
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - {Name: containerInsights, Value: disabled}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  # ECS がコンテナを起動するときに使う(イメージの取得・秘密情報の読み出し・ログ)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbSecret, !Ref SessionSecret, !Ref OidcSecret]

  # アプリが S3 を読み書きするときに使う。ListBucket は一覧のためではなく、
  # 存在しないファイルを確かめたときに 403 ではなく 404 を返してもらうために要る
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: documents-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${DocumentBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-app"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: X86_64}
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub "docker.io/earce9000/document-manager:${ImageTag}"
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: BASE_PATH, Value: /}
            - {Name: DATABASE_BACKEND, Value: postgres}
            - {Name: DATABASE_SSL, Value: "true"}
            - {Name: PGHOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: PGPORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: PGDATABASE, Value: document_manager}
            - {Name: STORAGE_BACKEND, Value: s3}
            - {Name: S3_BUCKET, Value: !Ref DocumentBucket}
            - {Name: S3_REGION, Value: !Ref AWS::Region}
            - {Name: OIDC_ISSUER, Value: !Ref OidcIssuer}
            - {Name: OIDC_CLIENT_ID, Value: !Ref OidcClientId}
            - {Name: OIDC_REDIRECT_URI, Value: !Sub "https://${DomainName}/login"}
            - {Name: ADMIN_EMAIL, Value: !Ref AdminEmail}
          Secrets:
            - {Name: PGUSER, ValueFrom: !Sub "${DbSecret}:username::"}
            - {Name: PGPASSWORD, ValueFrom: !Sub "${DbSecret}:password::"}
            - {Name: SESSION_SECRET, ValueFrom: !Ref SessionSecret}
            - {Name: OIDC_CLIENT_SECRET, ValueFrom: !Ref OidcSecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - {ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}

Outputs:
  Url:
    Description: 開く URL
    Value: !Sub "https://${DomainName}/"
  OidcRedirectUri:
    Description: OpenID Connect のプロバイダに登録するコールバック URL
    Value: !Sub "https://${DomainName}/login"
  DocumentBucketName:
    Description: 文書ファイルを置く S3 バケット(スタックを消しても残る)
    Value: !Ref DocumentBucket
  LogGroupName:
    Description: アプリのログ
    Value: !Ref LogGroup
