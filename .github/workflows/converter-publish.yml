name: Converter Publish

# Office→PDF変換サービス(converter/)のイメージをビルドして Docker Hub へ公開する。
# アプリ本体(docker-publish.yml)とは別のイメージ・別のタイミングで出す:
#   - converter/ を変更した push
#   - 毎週の定期ビルド(コードが変わらなくても、Debian側のセキュリティ修正を取り込むため)
#   - 手動実行
#
# amd64のみをビルドする。arm64はQEMUエミュレーション下での apt-get(LibreOffice一式)が
# 現実的な時間で終わらないため(運用サーバはx86_64)。
#
# 公開前に、実際のOfficeファイル(test/fixtures/office/)を変換する結合テストを必ず通す。

on:
  push:
    branches: [main]
    paths:
      - "converter/**"
      - "test/fixtures/office/**"
      - ".github/workflows/converter-publish.yml"
  pull_request:
    paths:
      - "converter/**"
      - "test/fixtures/office/**"
      - ".github/workflows/converter-publish.yml"
  schedule:
    # 毎週月曜 03:00 JST (日曜 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ビルド前にログインしておく(ベースイメージの取得を認証済みの枠で行う。
      # 匿名pullはGitHubランナーの共有IPでレート制限に当たりやすい)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 先にローカルへ読み込んで、変換が実際に通ることを確かめてから公開する
      - name: Build (load for test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: converter/Dockerfile
          platforms: linux/amd64
          load: true
          tags: document-manager-converter:test
          cache-from: type=gha,scope=converter
          cache-to: type=gha,mode=max,scope=converter

      # 既定値のインスタンスと、上限・タイムアウトを小さくしたインスタンスの2つを立てる
      # (既定は50MB・120秒で、そのまま上限を試すには時間もデータ量も大きすぎるため)
      - name: Start converter
        run: |
          docker run -d --name converter -p 3010:3000 \
            --tmpfs /tmp:rw,size=512m --read-only --memory 1g \
            document-manager-converter:test
          docker run -d --name converter-limits -p 3011:3000 \
            --tmpfs /tmp:rw,size=512m --read-only --memory 1g \
            -e CONVERT_MAX_BYTES=1048576 -e CONVERT_TIMEOUT_SECONDS=2 \
            document-manager-converter:test
          for i in $(seq 1 90); do
            curl -sf -m 2 http://127.0.0.1:3010/health > /dev/null \
              && curl -sf -m 2 http://127.0.0.1:3011/health > /dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:3010/health

      # 実際のExcel/Word/PowerPointを変換して、PDFが返ることを確かめる(所要時間も出る)。
      # あわせて、拡張子・マクロ・壊れたファイル・サイズ上限・タイムアウトの扱いも確かめる
      - name: Smoke test
        env:
          CONVERTER_LIMITS_URL: http://127.0.0.1:3011
        run: node converter/test/smoke.js

      # Document Manager本体と繋いだ結合テスト。スタブではなく本物のconverterを相手に、
      # アップロード → 変換 → PDF取得 → PDFの中身に元の文字が入っていること、まで確かめる
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ロックファイルはコミットしていない(マルチアーキテクチャのビルドで依存を選び直すため。
      # app/.gitignore 参照)。したがって npm ci は使えず、npm install を使う
      - name: Install app dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: app

      - name: Integration test (app + converter)
        env:
          CONVERTER_URL: http://127.0.0.1:3010
        run: npm run test:converter

      - name: Converter logs
        if: always()
        run: |
          docker logs converter || true
          docker logs converter-limits || true

      - name: Compute build version
        id: version
        run: echo "value=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: converter/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            earce9000/document-manager-converter:latest
            earce9000/document-manager-converter:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=converter

      # 1イメージ1GB超のため、日時タグは直近3世代だけ残す(latestは常に残る)。
      # 失敗してもワークフロー自体は成功扱いにする(公開そのものは終わっているため)
      - name: Prune old tags
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="earce9000/document-manager-converter"
          # 応答は秘密情報を含むため、本文は出さずに状態だけを出す
          login=$(curl -s -o /tmp/login.json -w "%{http_code}" -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/)
          jwt=$(jq -r '.token // empty' /tmp/login.json)
          echo "ログイン: HTTP ${login} / トークン取得: $([ -n "$jwt" ] && echo あり || echo なし)"
          if [ -z "$jwt" ]; then
            echo "ログインできなかったため、タグの整理は行いません(トークンの権限・2要素認証の設定を確認してください)"
            exit 0
          fi
          # 日時タグ(YYYYMMDD_HHMMSS)だけを対象にし、新しい3件を残して削除する。
          # APIの並び順には依存せず、タグ名(日時)で降順に並べてから判断する
          curl -s -H "Authorization: JWT ${jwt}" \
            "https://hub.docker.com/v2/repositories/${repo}/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]{8}_[0-9]{6}$' \
            | sort -r \
            | tail -n +4 \
            | while read -r tag; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: JWT ${jwt}" \
                  "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/" || echo "000")
                echo "削除: ${tag} -> HTTP ${code}"
              done
