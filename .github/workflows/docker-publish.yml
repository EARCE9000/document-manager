name: Docker Publish

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # イメージのタグとアプリ内のバージョン表示を同じ値に揃える
      - name: Compute build version
        id: version
        # 版は YYYYMMDD.HHMM(JST)。画面の Ver. 表示とイメージのタグが同じ値になる。
        # 分までにしているのは、人が読み上げたり見比べたりする値だから
        # (同じ1分のうちに2回作ると同じタグになり、後のものが上書きする)
        run: echo "value=$(TZ=Asia/Tokyo date +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: earce9000/document-manager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 日時タグは切り戻し用だが、際限なく溜まるため直近10世代だけ残す(latestは常に残る)。
      # 失敗してもワークフロー自体は成功扱いにする(公開そのものは終わっているため)
      - name: Prune old tags
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="earce9000/document-manager"
          # 応答は秘密情報を含むため、本文は出さずに状態だけを出す
          login=$(curl -s -o /tmp/login.json -w "%{http_code}" -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/)
          jwt=$(jq -r '.token // empty' /tmp/login.json)
          echo "ログイン: HTTP ${login} / トークン取得: $([ -n "$jwt" ] && echo あり || echo なし)"
          if [ -z "$jwt" ]; then
            echo "ログインできなかったため、タグの整理は行いません(トークンの権限・2要素認証の設定を確認してください)"
            exit 0
          fi
          # 日時タグだけを対象にし、新しい10件を残して削除する。
          # いまの形(YYYYMMDD.HHMM)と、以前の形(YYYYMMDD_HHMMSS)の両方を数える
          # (以前の形を対象から外すと、古いタグが永久に残る)。
          # APIの並び順には依存せず、タグ名(日時)で降順に並べてから判断する
          curl -s -H "Authorization: JWT ${jwt}" \
            "https://hub.docker.com/v2/repositories/${repo}/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]{8}(\.[0-9]{4}|_[0-9]{6})$' \
            | sort -r \
            | tail -n +11 \
            | while read -r tag; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: JWT ${jwt}" \
                  "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/" || echo "000")
                echo "削除: ${tag} -> HTTP ${code}"
              done
