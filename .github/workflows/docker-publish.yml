name: Docker Publish

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # イメージのタグとアプリ内のバージョン表示を同じ値に揃える
      - name: Compute build version
        id: version
        run: echo "value=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: earce9000/document-manager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 日時タグは切り戻し用だが、際限なく溜まるため直近10世代だけ残す(latestは常に残る)。
      # 失敗してもワークフロー自体は成功扱いにする(公開そのものは終わっているため)
      - name: Prune old tags
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="earce9000/document-manager"
          # 応答は秘密情報を含むため、本文は出さずに状態だけを出す
          login=$(curl -s -o /tmp/login.json -w "%{http_code}" -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/)
          jwt=$(jq -r '.token // empty' /tmp/login.json)
          echo "ログイン: HTTP ${login} / トークン取得: $([ -n "$jwt" ] && echo あり || echo なし)"
          if [ -z "$jwt" ]; then
            echo "ログインできなかったため、タグの整理は行いません(トークンの権限・2要素認証の設定を確認してください)"
            exit 0
          fi
          # 日時タグ(YYYYMMDD_HHMMSS)だけを対象にし、新しい10件を残して削除する。
          # APIの並び順には依存せず、タグ名(日時)で降順に並べてから判断する
          curl -s -H "Authorization: JWT ${jwt}" \
            "https://hub.docker.com/v2/repositories/${repo}/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]{8}_[0-9]{6}$' \
            | sort -r \
            | tail -n +11 \
            | while read -r tag; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: JWT ${jwt}" \
                  "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/" || echo "000")
                echo "削除: ${tag} -> HTTP ${code}"
              done
