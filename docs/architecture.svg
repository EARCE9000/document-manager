<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
	<title>Document Manager のコンテナ構成</title>
	<desc>deploy/compose.yml の構成。アプリだけがリバースプロキシから見え、変換サービスは外に出られない専用ネットワークに閉じている。</desc>

	<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
		</marker>
		<marker id="arrowBlocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
		</marker>
	</defs>

	<text x="24" y="34" font-size="17" font-weight="600" fill="#24292f">Document Manager のコンテナ構成 (deploy/compose.yml)</text>
	<text x="24" y="56" font-size="12.5" fill="#57606a">外から見えるのはアプリだけ。変換サービスは外に出られない専用ネットワークに閉じている。</text>

	<!-- ===== 外部からの入口。ブラウザとAIエージェントは、どちらもApache経由で同じアプリを使う ===== -->
	<g>
		<rect x="24" y="152" width="100" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
		<text x="74" y="175" font-size="12.5" font-weight="600" text-anchor="middle" fill="#24292f">ブラウザ</text>
		<text x="74" y="194" font-size="10.5" text-anchor="middle" fill="#57606a">OIDCでログイン</text>

		<rect x="134" y="152" width="110" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
		<text x="189" y="175" font-size="12.5" font-weight="600" text-anchor="middle" fill="#24292f">AIエージェント</text>
		<text x="189" y="194" font-size="10.5" text-anchor="middle" fill="#57606a">APIキーでREST</text>

		<rect x="24" y="244" width="200" height="52" rx="8" fill="#eef4ff" stroke="#9cc2ff"/>
		<text x="124" y="266" font-size="13" font-weight="600" text-anchor="middle" fill="#24292f">Apache</text>
		<text x="124" y="284" font-size="11.5" text-anchor="middle" fill="#57606a">リバースプロキシ</text>
	</g>
	<path d="M 74 210 L 90 242" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
	<path d="M 189 210 L 165 242" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

	<!-- ===== application_network ===== -->
	<rect x="232" y="232" width="238" height="76" rx="8" fill="none" stroke="#9cc2ff" stroke-width="1.4" stroke-dasharray="5 4"/>
	<text x="240" y="249" font-size="11" fill="#3d6fb4">application_network (既存・external)</text>

	<!-- ===== アプリ ===== -->
	<rect x="252" y="256" width="198" height="44" rx="8" fill="#eef4ff" stroke="#3d6fb4" stroke-width="1.6"/>
	<text x="351" y="274" font-size="13.5" font-weight="600" text-anchor="middle" fill="#24292f">document_manager</text>
	<text x="351" y="291" font-size="11.5" text-anchor="middle" fill="#57606a">アプリ本体 (固定IP・:8080)</text>
	<path d="M 224 270 L 250 270" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

	<!-- ===== 変換用ネットワーク ===== -->
	<rect x="510" y="96" width="364" height="150" rx="10" fill="#fff6f5" stroke="#e5a9a1" stroke-width="1.4" stroke-dasharray="5 4"/>
	<text x="522" y="116" font-size="11.5" font-weight="600" fill="#a13c2e">document_manager_convert (internal: true)</text>
	<text x="522" y="133" font-size="11" fill="#a13c2e">インターネットにも他のサービスにも出られない</text>

	<rect x="540" y="148" width="222" height="60" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
	<text x="651" y="170" font-size="13.5" font-weight="600" text-anchor="middle" fill="#24292f">converter</text>
	<text x="651" y="188" font-size="11.5" text-anchor="middle" fill="#57606a">LibreOffice で Office→PDF (:3000)</text>
	<text x="651" y="228" font-size="11" text-anchor="middle" fill="#a13c2e">読み取り専用 / tmpfs / 非root / メモリ上限</text>

	<path d="M 450 268 C 500 268 500 180 538 178" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
	<text x="470" y="214" font-size="11" fill="#57606a">変換を依頼</text>

	<!-- 外に出られないことを示す -->
	<path d="M 806 148 L 806 108" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowBlocked)"/>
	<line x1="796" y1="132" x2="816" y2="112" stroke="#c0392b" stroke-width="2.4"/>
	<line x1="796" y1="112" x2="816" y2="132" stroke="#c0392b" stroke-width="2.4"/>
	<text x="828" y="126" font-size="11" fill="#c0392b">外部</text>

	<!-- ===== 内部ネットワーク ===== -->
	<rect x="510" y="292" width="364" height="186" rx="10" fill="#f6fbf7" stroke="#a7cbb0" stroke-width="1.4" stroke-dasharray="5 4"/>
	<text x="522" y="312" font-size="11.5" font-weight="600" fill="#2f7d45">document_manager_internal</text>
	<text x="522" y="329" font-size="11" fill="#2f7d45">ホストにポートを公開しない</text>

	<rect x="540" y="344" width="222" height="56" rx="8" fill="#eaf6ee" stroke="#2f7d45" stroke-width="1.5"/>
	<text x="651" y="365" font-size="13.5" font-weight="600" text-anchor="middle" fill="#24292f">weaviate</text>
	<text x="651" y="383" font-size="11.5" text-anchor="middle" fill="#57606a">ベクトルDB (:8080 / gRPC :50051)</text>

	<rect x="540" y="412" width="222" height="52" rx="8" fill="#eaf6ee" stroke="#2f7d45" stroke-width="1.5"/>
	<text x="651" y="432" font-size="13.5" font-weight="600" text-anchor="middle" fill="#24292f">t2v-transformers</text>
	<text x="651" y="450" font-size="11.5" text-anchor="middle" fill="#57606a">Embedding 計算 (自己ホスト時)</text>

	<path d="M 651 400 L 651 410" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
	<path d="M 450 286 C 500 300 500 360 538 368" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
	<text x="462" y="330" font-size="11" fill="#57606a">意味検索</text>

	<!-- converter から Weaviate へ到達できない -->
	<path d="M 651 210 L 651 340" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
	<line x1="641" y1="285" x2="661" y2="265" stroke="#c0392b" stroke-width="2.4"/>
	<line x1="641" y1="265" x2="661" y2="285" stroke="#c0392b" stroke-width="2.4"/>
	<text x="668" y="279" font-size="11" fill="#c0392b">到達できない</text>

	<!-- ===== 永続化 ===== -->
	<rect x="232" y="344" width="238" height="134" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.4"/>
	<text x="244" y="364" font-size="11.5" font-weight="600" fill="#57606a">ホストのディレクトリ</text>

	<rect x="252" y="376" width="198" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
	<text x="351" y="395" font-size="12.5" font-weight="600" text-anchor="middle" fill="#24292f">/data</text>
	<text x="351" y="412" font-size="11" text-anchor="middle" fill="#57606a">文書ファイル + SQLite</text>

	<rect x="252" y="428" width="198" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
	<text x="351" y="446" font-size="12.5" font-weight="600" text-anchor="middle" fill="#24292f">/var/lib/weaviate</text>
	<text x="351" y="461" font-size="11" text-anchor="middle" fill="#57606a">ベクトルDBのデータ</text>

	<path d="M 351 300 L 351 374" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
	<path d="M 538 372 C 500 372 480 430 452 444" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#arrow)"/>

	<!-- ===== 凡例 ===== -->
	<rect x="24" y="512" width="850" height="84" rx="8" fill="#fafbfc" stroke="#d0d7de"/>
	<text x="40" y="534" font-size="12" font-weight="600" fill="#24292f">読み方</text>
	<text x="40" y="554" font-size="11.5" fill="#57606a">・converter と weaviate / t2v-transformers は<tspan font-weight="600" fill="#24292f">どちらも任意</tspan>。無くてもアプリは動く(体裁つき表示・意味検索だけが使えなくなる)</text>
	<text x="40" y="572" font-size="11.5" fill="#57606a">・converter は信用できない文書を LibreOffice で開くため、<tspan font-weight="600" fill="#a13c2e">外にも他サービスにも出られないネットワーク</tspan>に閉じている</text>
	<text x="40" y="590" font-size="11.5" fill="#57606a">・メタDBは PostgreSQL、文書ファイルは S3 / GCS へ切り替えられる(その場合ホストのディレクトリは不要)</text>
</svg>
