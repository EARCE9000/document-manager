# Copyright(c) 2026 EARCE.NET <d.idei@earce.net>
# MIT Licensed
#
# ベクトル(意味)検索は任意機能。使わない場合はこのファイルを使わず、これまで通り
# `docker build` + `docker run` で app サービス単体を起動すればよい(README参照)。
# WEAVIATE_URL を設定した場合のみ有効化される(app/lib/vector-search.js参照)。
#
# Embedding計算の方式(WEAVIATE_VECTORIZER)は既定で自己ホストのtext2vec-transformers
# (外部APIキー不要、t2v-transformersコンテナを使用)。Cohere/OpenAI等の外部APIに
# 切り替える場合は、appサービスの環境変数(WEAVIATE_VECTORIZER・各種APIKEY)を
# .env等で上書きすればよく、このファイル自体の編集は不要(t2v-transformersコンテナは
# 未使用になるだけで、動かしたままでも害はない。不要なら`docker compose up -d app weaviate`
# のようにサービスを指定して起動すれば省略できる)。
#
# 検索結果のリランキング(並び替え)も同様に任意機能。既定は無効(距離順のまま)。
# appのWEAVIATE_RERANKER=reranker-transformersで有効化すると、reranker-transformers
# コンテナ(自己ホストのクロスエンコーダ、LLMではない)が使われる。こちらも外部APIキー不要で、
# 未使用ならreranker-transformersコンテナごと`docker compose up -d app weaviate t2v-transformers`
# のように省略してよい。
#
# ⚠️ リランキングは自己責任機能: GPU無し実機でクロスエンコーダの実測を行ったところ、
# 候補1件あたり約400〜550msかかった。既定の候補数(検索APIのlimit×3、limit=20なら60件)では
# 25〜30秒かかり、Weaviateの30秒gRPCタイムアウトを超えて検索結果が空で返ることがある
# (文書の総数には依存しない。候補数だけで決まる)。有効化する場合は検索時のlimitを
# 小さめに指定するなど利用側で候補数を絞ること。詳細はREADME.mdの「リランキング」項目を参照。
#
# weaviate/t2v-transformers/reranker-transformersのイメージタグは:latest相当(具体的なモデル名タグ)
# にしている。自己ホスト運用では動作確認後にバージョンを固定することを推奨する。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_GRPC_PORT=50051
      # 既定はtext2vec-transformers(外部APIキー不要)。Cohere/OpenAIを使う場合は
      # .env等でWEAVIATE_VECTORIZER=text2vec-cohere(またはtext2vec-openai)と
      # 対応するAPIキーを設定する(COHERE_APIKEY / OPENAI_APIKEY)
      - WEAVIATE_VECTORIZER=${WEAVIATE_VECTORIZER:-text2vec-transformers}
      - COHERE_APIKEY=${COHERE_APIKEY:-}
      - OPENAI_APIKEY=${OPENAI_APIKEY:-}
      # 既定は無効(空文字)。⚠️自己責任機能(CPU実行時は低速・タイムアウトの実績あり。
      # 上記の注記参照)。有効化する場合は .env 等で WEAVIATE_RERANKER=reranker-transformers を指定する
      - WEAVIATE_RERANKER=${WEAVIATE_RERANKER:-}
      # OIDC_*/SESSION_SECRET等、既存の必須環境変数はREADMEの「環境変数」表を参照して別途指定すること
      - AUTH_DISABLED=${AUTH_DISABLED:-}
    depends_on:
      - weaviate

  # ベクトルDB本体。REST(8080)とgRPC(50051)の両方をappコンテナから使う
  weaviate:
    image: semitechnologies/weaviate:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      # text2vec-cohere/text2vec-openaiは追加コンテナ不要(Weaviate本体に組み込み済みで
      # 外部APIを呼ぶだけ)なため、appのWEAVIATE_VECTORIZER/WEAVIATE_RERANKERを
      # いつでも切り替えられるようまとめて有効化しておく(未使用の方式は単に呼ばれない)
      - ENABLE_MODULES=text2vec-transformers,text2vec-cohere,text2vec-openai,reranker-transformers
      - DEFAULT_VECTORIZER_MODULE=text2vec-transformers
      - TRANSFORMERS_INFERENCE_API=http://t2v-transformers:8080
      - RERANKER_INFERENCE_API=http://reranker-transformers:8080
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - t2v-transformers
      - reranker-transformers

  # Embedding推論サーバー(Weaviate公式のOSSコンテナ)。WEAVIATE_VECTORIZER=text2vec-transformers
  # (既定)の場合のみ使われる。日本語を含む多言語文書のため多言語sentence-transformers
  # モデルを使用する。外部APIキーは不要
  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2
    restart: unless-stopped
    environment:
      - ENABLE_CUDA=0

  # リランキング推論サーバー(Weaviate公式のOSSコンテナ)。WEAVIATE_RERANKER=reranker-transformers
  # を指定した場合のみ使われる。クロスエンコーダはLLM(文章生成)ではなく、クエリと文書の
  # 組から関連度スコアだけを返す専用の小さなモデル。日本語を含む多言語文書のため
  # BAAI/bge-reranker-v2-m3(多言語対応クロスエンコーダ)を使用する。外部APIキーは不要。
  # ⚠️GPU無し実機でCPU推論が候補1件あたり約400〜550msと低速なことを実測済み(自己責任機能)
  reranker-transformers:
    image: semitechnologies/reranker-transformers:baai-bge-reranker-v2-m3
    restart: unless-stopped

volumes:
  weaviate_data:
